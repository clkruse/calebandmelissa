<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sky Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%230039A6%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27white%27/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="map"></div>

  <div id="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#E03C31"></span>Heavy</div>
    <div class="legend-item"><span class="legend-dot" style="background:#0039A6"></span>Large</div>
    <div class="legend-item"><span class="legend-dot" style="background:#F7931E"></span>Small</div>
    <div class="legend-item"><span class="legend-dot" style="background:#00A65C"></span>Light</div>
    <div class="legend-item"><span class="legend-dot" style="background:#A626AA"></span>Helicopter</div>
    <div class="legend-item"><span class="legend-dot" style="background:#FCCC0A"></span>UAV</div>
    <div class="legend-item"><span class="legend-dot" style="background:#9B9B9B"></span>Unknown</div>
  </div>

  <div id="splitflap"></div>

  <div id="no-planes-overlay"><span>No planes found</span></div>

  <div id="plane-info-panel"></div>

  <div id="status-bar">Loading...</div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/planes.js"></script>
  <script src="js/map.js"></script>
  <script src="js/splitflap.js"></script>
  <script src="js/app.js"></script>
  <!-- Home kiosk: lets the laptop server switch the iPad to another page -->
  <script src="/kiosk/kiosk.js" data-app="planes"></script>
</body>
</html>
